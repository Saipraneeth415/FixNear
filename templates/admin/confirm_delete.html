{% extends "base.html" %}
{% block title %}Delete {{ kind }} | Admin | FixNear{% endblock %}
{% block content %}
<section class="section auth-section">
  <div class="auth-wrap">
    <div class="panel auth-card">
      <h1>Delete this {{ kind }}?</h1>
      <p><strong>{{ name }}</strong></p>
      {% if blocked %}
        <div class="form-alert" role="alert">{{ blocked }}</div>
        <a class="btn btn-outline btn-lg btn-block" href="{{ back_url }}">Back</a>
      {% else %}
        <p class="muted">This cannot be undone.{% if note %} {{ note }}{% endif %}</p>
        <form class="form-stack" method="post" action="{{ action_url }}">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          <button class="btn btn-danger btn-lg btn-block" type="submit">Yes, delete this {{ kind }}</button>
          <a class="btn btn-outline btn-lg btn-block" href="{{ back_url }}">Keep it</a>
        </form>
      {% endif %}
    </div>
  </div>
</section>
{% endblock %}
